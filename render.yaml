# Render Blueprint (free plan: no persistent disk, so saved data is lost on restart).
# Gemma is not hosted: the hosted app serves hypotheses pre-generated by Gemma (see pregenerate.py).
services:
  - type: web
    name: lore-lab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LORE_PREGENERATED_ONLY
        value: "1"